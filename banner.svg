    <rect x="346" y="238" width="112" height="30" rx="4" fill="none" stroke="#00d4ff" stroke-opacity="0.5"/>
    <text x="360" y="257" font-size="12" fill="#00d4ff">MULTI-CLOUD</text>
    <rect x="472" y="238" width="148" height="30" rx="4" fill="none" stroke="#00d4ff" stroke-opacity="0.5"/>
