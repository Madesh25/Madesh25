  <text x="52" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#00d4ff">DevOps Engineer  |  Kubernetes  |  Terraform  |  CI/CD</text>
  <line x1="50" y1="166" x2="620" y2="166" stroke="#00ff6a" stroke-opacity="0.4" stroke-width="1"/>
  <text x="50" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#a1a1aa">Automating infrastructure and running cloud-native platforms</text>
  <text x="50" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#a1a1aa">across <tspan fill="#00ff6a">AWS</tspan>, <tspan fill="#00ff6a">Azure</tspan> and <tspan fill="#00ff6a">GCP</tspan></text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
