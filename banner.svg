<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Madeshwaran M - DevOps Engineer">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff6a"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#12261b" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" rx="10" fill="#09090b"/>
  <rect width="1000" height="300" rx="10" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="298" rx="10" fill="none" stroke="#00ff6a" stroke-opacity="0.35" stroke-width="2"/>

  <rect x="1" y="1" width="998" height="34" rx="10" fill="#0d1a12"/>
  <rect x="1" y="24" width="998" height="12" fill="#0d1a12"/>
  <circle cx="26" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="46" cy="18" r="5" fill="#ffbd2e"/>
