  <text x="92" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c8c6f">madesh@portfolio:~$ whoami</text>
  <line x1="1" y1="35" x2="999" y2="35" stroke="#00ff6a" stroke-opacity="0.3" stroke-width="1"/>

