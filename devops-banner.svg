<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020806"/>
    <stop offset="1" stop-color="#06110b"/>
  </linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#39ff88"/>
    <stop offset="1" stop-color="#00d95f"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#19e86a" opacity=".25"/>
  </pattern>
</defs>
<rect width="1200" height="330" rx="16" fill="url(#bg)"/>
<rect width="1200" height="330" rx="16" fill="url(#dots)"/>
